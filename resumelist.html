<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/resumelist.css" />
    <title>resumelist</title>
  </head>
  <body>
    <!-- 우선 header 작업. 폰트는 나중에하고 틀먼저 -->
    <header>
      <div class="inner">
        <div class="head--container">
          <div class="head--brand head--name">이력서플랫폼</div>
          <div class="head--brand--info">
            <div class="head--brand">홍길동님</div>
            <div class="head--brand">
              <a href="">마이페이지</a>
            </div>
            <div class="head--brand">
              <a href="">로그아웃</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <section>
      <div class="class--article--skill--container">
        <div class="search--skill">
          <select name="skill--stack" id="skill--stack--list">
            <option value="" selected disabled hidden>기술스택</option>
            <option value="HTML\CSS">JavaScript</option>
            <option value="JavaScript">PHP</option>
            <option value="MySQL">Java</option>
            <option value="Spring">Golang</option>
            <option value="JAVA">Python</option>
          </select>
        </div>
        <div class="search--work--experience"></div>
      </div>
      <div class="portfolio--container">
        <div class="user--profile--img"></div>
        <div class="user--title--container"></div>
        <div class="user--address--container"></div>
        <div class="user--skill--container"></div>
      </div>
      <div class="class--article--pagination--container"></div>
    </section>
    <footer></footer>
  </body>
</html>
