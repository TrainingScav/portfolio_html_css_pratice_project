<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/signup_style.css">
    
    <title>이력서플랫폼</title>
</head>
<body>
    <header>
        <div class="inner">
            <div class="head--container">
                <div class="head--brand"><a href="">이력서플랫폼</a></div>
                <div class="head--container2">
                    <div class="head--brand1"><a href="">로그인</a></div>
                    <div class="head--brand2"><a href="">회원가입</a></div>
                </div>
            </div>
        </div>
    </header>

        <div class="inner">
            <div class="signup">
                <h2>SIGN UP</h2>
            </div>
                <div class="signup--container">
                        <form class="signup--form">
                            <div class="test">
                                <div class="signup--id">
                                    <div class="label--id">아이디</div>
                                    <input type="text" name="id"  placeholder="아이디를 입력해주세요">
                                </div>
                                <button class="button">중복확인</button>
                            </div>
                            <div class="signup--name">이름<input type="name"  placeholder="이름을 입력해주세요"></div>
                            <div class="signup--password">비밀번호<input type="password" placeholder="비밀번호를 입력해주세요"></div>
                            <div class="signup--password--check">비밀번호 확인<input type="password" placeholder="비밀번호를 입력해주세요"></div>
                                <button class="button1">회원가입</button>
                        </form>
                </div>
        </div>
            
            <footer>
                <div class="inner">
                    <div class="footer--copyright">
                        copyright(c)2024 홍길동 All rights reserved.                           
                    </div>
                </div>
            </footer>
           
</body>
</html>
